<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funniest Friend</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>😂 Funniest Friend</h1>
    <p class="tagline">Who's actually carrying the group chat -- ranked by real tapback data.</p>
  </header>

  <section class="picker">
    <select id="chat-select">
      <option value="">Loading group chats…</option>
    </select>
    <button id="refresh-btn" title="Re-scan chat.db for new messages">↻ Refresh</button>
  </section>

  <p id="error-banner" class="error hidden"></p>

  <section id="leaderboard" class="hidden">
    <h2>Leaderboard</h2>
    <p class="meta" id="chat-meta"></p>
    <ol id="board"></ol>
  </section>

  <section id="analyze-section" class="hidden">
    <button id="analyze-btn">🤖 Ask AI who's the funniest</button>
    <div id="analysis" class="hidden">
      <div class="funniest-card" id="funniest-card"></div>
      <div class="superlatives" id="superlatives"></div>
      <p class="closing-line" id="closing-line"></p>
    </div>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
